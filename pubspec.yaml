name: mvst
description: "Paiement de biellets de voyage en ligne pour la compagnie MVST."
# ---------------------------

publish_to: 'none' 

# ---------------------------
version: 1.0.0+1

environment:
  sdk: ^3.11.1

# --------------------------
dependencies:
  flutter:
    sdk: flutter

  # ------------------------
  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  socket_io_client: ^3.1.4
  firebase_core: ^4.5.0
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  ticket_widget: ^1.0.2
  badges: ^3.1.2
  shared_preferences: ^2.5.4
  ticket_material: ^0.3.1
  qr_flutter: ^4.1.0
  open_file: ^3.5.11
  path_provider: ^2.1.5
  pdf: ^3.12.0
  permission_handler: ^12.0.1
  firebase_auth: ^6.2.0
  firebase_crashlytics: ^5.0.8
  carousel_slider: ^5.1.2
  modal_progress_hud_nsn: ^0.5.1
  get: ^4.7.3
  flutter_spinkit: ^5.2.2
  equatable: ^2.0.8
  flutter_ticket: ^1.0.1
  http: ^1.6.0
  flutter_direct_caller_plugin: ^0.0.4
  bloc: ^9.2.0
  cloud_firestore: ^6.1.3



#--------------------

  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0

  intl: any
  google_fonts: ^8.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

#flutter pub run flutter_native_splash:create
# theme vert :  "#004D40"
# theme bleu : "#1288E9" 
flutter_native_splash:
  image: "assets/splashC.png"
  color: "#FFFFFF" 

#flutter pub run flutter_launcher_icons:main
#flutter_icons:
flutter_launcher_icons:
  remove_alpha_ios: true
  android: true
  image_path: "icons/logo2.png"


  # ----------------------------
  flutter_lints: ^6.0.0

# ------------------------------
flutter:

  
  uses-material-design: true

#-------------------------------

  assets:
    - assets/images/


  #-----------------------------

  fonts:
    - family: Lobster
      fonts:
        - asset: fonts/Lobster-Regular.ttf
    - family: PlayfairDisplay
      fonts:
        - asset: fonts/PlayfairDisplay-VariableFont_wght.ttf